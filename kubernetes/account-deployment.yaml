apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: account
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: account
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: account
    spec:
      containers:
        - env:
            - name: DB_DSN
              value: postgres://postgres:postgres@account-db:5432/account?sslmode=disable
            - name: GRPC_PORT
              value: "50051"
            - name: KAFKA_BROKER_HOST
              value: kafka:9092
            - name: KAFKA_CONSUMER_GROUP
              value: consumer-account
            - name: KAFKA_TRANSACTION_TOPIC
              value: transaction_data
          image: local-env-account:latest
          imagePullPolicy: IfNotPresent
          name: account
          ports:
            - containerPort: 50051
              protocol: TCP
      restartPolicy: Always
