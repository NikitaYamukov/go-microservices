apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: transaction
  name: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: transaction
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: transaction
    spec:
      containers:
        - env:
            - name: ACCOUNT_GRPC_HOST
              value: account:50051
            - name: DB_DSN
              value: postgres://postgres:postgres@transaction-db:5432/transaction?sslmode=disable
            - name: GRPC_PORT
              value: "50054"
            - name: KAFKA_BROKER_HOST
              value: kafka:9092
            - name: KAFKA_CONSUMER_GROUP
              value: consumer
            - name: KAFKA_TRANSACTION_TOPIC
              value: transaction_response
          image: local-env-transaction:latest
          imagePullPolicy: IfNotPresent
          name: transaction
          ports:
            - containerPort: 50054
              protocol: TCP
      restartPolicy: Always
