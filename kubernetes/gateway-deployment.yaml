apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: gateway
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: gateway
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: gateway
    spec:
      containers:
        - env:
            - name: ACCOUNT_GRPC_HOST
              value: account:50051
            - name: AUTH_GRPC_HOST
              value: auth:50052
            - name: GRPC_PORT
              value: "50053"
            - name: JWT_SECRET
              value: secret
            - name: TRANSACTION_GRPC_HOST
              value: transaction:50054
          image: local-env-gateway:latest
          imagePullPolicy: IfNotPresent
          name: gateway
          ports:
            - containerPort: 50053
              protocol: TCP
      restartPolicy: Always
