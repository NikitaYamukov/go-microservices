name: Transaction

on:
  workflow_dispatch:
  push:
    paths:
      - "transaction/**"

jobs:
  stage_dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: transaction

    steps:
      - name: get code
        uses: actions/checkout@v3.5.3

      - name: install deps
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
