name: Transaction

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/transaction.yaml"
      - "transaction/**"

jobs:
  stage_dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: transaction

    steps:
      - name: get code
        uses: actions/checkout@v3.5.3

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: transaction/go.mod
          cache-dependency-path: transaction/go.sum

      - name: install deps
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
